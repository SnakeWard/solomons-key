lot:
  routes:
    - route_id: ci
      required_gates: [unit_tests_gate, security_review_gate]
      required_artifacts: [gate_decision_artifact]
gates:
  gate_entries:
    - gate_id: unit_tests_gate
      enforcement_class: automatic
      required_evidence: [validation_report_artifact]
      failure_response: block
    - gate_id: security_review_gate
      enforcement_class: attested
      required_evidence: [validation_report_artifact]
      failure_response: block
artifacts:
  artifact_entries:
    - artifact_id: gate_decision_artifact
      produced_by_role: build
    - artifact_id: validation_report_artifact
      produced_by_role: build
