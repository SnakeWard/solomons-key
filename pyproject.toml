[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solomons-key"
dynamic = ["version"]
description = "A verifier for AI-assisted builds: proves whether a step was computed or asserted"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Little Revelations Studio" }]
keywords = ["attestation", "provenance", "supply-chain", "ai-agents", "verification", "in-toto", "slsa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/SnakeWard/Solomons-Key"

[project.scripts]
sk-init = "sk_init:main"
sk-adapt = "sk_adapt:main"
sk-lint = "sk_lint:main"
sk-ledger = "sk_ledger:main"
sk-artifacts = "sk_artifacts:main"
sk-emit = "sk_emit:main"
sk-verify = "sk_verify:main"
sk-handoff = "sk_handoff:main"

[tool.setuptools]
py-modules = [
  "sk_init",
  "sk_adapt",
  "sk_lint",
  "sk_ledger",
  "sk_artifacts",
  "sk_emit",
  "sk_verify",
  "sk_handoff",
  "sk_resources",
]
packages = ["solomons_key", "solomons_key._schemas", "solomons_key.in_toto"]
package-dir = { "solomons_key._schemas" = "schemas/artifacts" }
include-package-data = true

[tool.setuptools.package-data]
"solomons_key._schemas" = ["*.schema.json"]
"solomons_key.in_toto" = ["*.schema.json", "fixtures/*.json"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
