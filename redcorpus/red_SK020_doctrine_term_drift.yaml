runtime_boundaries:
  runtime_boundaries_id: solomons-key.logic-engine.v1.runtime_boundaries
  runtime_boundaries_name: Solomon's Key Runtime Boundaries
  runtime_boundaries_purpose: Define bounded runtime boundary zones, mutation scope values, boundary decision
    values, and violation failure map.
  boundary_zones:
  - protected_source_zone
  - generated_workspace_zone
  - schema_zone
  - example_zone
  - test_zone
  - script_zone
  - report_zone
  - ledger_zone
  - final_artifact_zone_reserved
  - shell_command_zone
  - external_tool_zone
  mutation_scope_values:
  - none
  - read_only
  - generated_workspace_only
  - approved_generated_files_only
  - repair_generated_files_only
  - final_artifact_only_after_acceptance
  - forbidden
  boundary_decision_values:
  - allowed
  - denied
  - repair_required
  - refused
  - escalated
  - blocked
  boundary_rules:
  - Protected source files are read-only. Protected source mutation is always blocked.
  - The generated workspace zone permits writes only to approved generated files.
  - The final artifact zone is reserved. Only the user-authorized final assembly pass may promote it.
  - Shell commands run within this zone. Shell actors are bounded. No shell actor may receive unrestricted
    authority.
  - Claude is a bounded build/review actor. Codex, Grok, and Claude are bounded build/review actors only.
  - No AI actor may claim final authority.
  - Repair loops may modify generated files only. Repair loops must not modify protected source files.
  - The ledger is append-only. Prior ledger entries must not be rewritten.
  - Every boundary violation fails closed.
  violation_failure_map:
  - boundary_zone: protected_source_zone
    violation_failure_id: protected_source_mutation_attempt
    response: terminal_block
  - boundary_zone: final_artifact_zone_reserved
    violation_failure_id: final_assembly_before_acceptance
    response: terminal_block
  - boundary_zone: shell_command_zone
    violation_failure_id: unbounded_actor_authority
    response: block
  - boundary_zone: ledger_zone
    violation_failure_id: ledger_tamper_attempt
    response: block
  final_artifact_zone_reservation: final_artifact_zone_reserved remains reserved for runtime use after
    final protocol assembly.
  final_artifact_zone_reserved_status: reserved
