  validation_result_values:
  - pass
  - fail
  - repair_required
  - refused
  - escalated
  - blocked
  - not_checked
  binding_rules:
  - Every governed route must produce a validation_report_artifact.
  - Validation results must be recorded in telemetry and ledger.
  - A validation failure must trigger the failure response for the route.
  - Tests serve as the judge. No actor may override a test failure.
  - Validation bypass is rejected. All layers must run.
  final_assembly_readiness_validation_rule: The final_assembly_readiness_validation layer verifies all
    acceptance readiness checks before final assembly is proposed.
  acceptance_lock_validation_rule: The acceptance_lock_validation layer confirms user authorization is
    recorded before any final assembly action.
