failure_taxonomy:
  failure_taxonomy_id: solomons-key.logic-engine.v1.failure_taxonomy
  failure_taxonomy_name: Solomon's Key Failure Taxonomy
  failure_taxonomy_purpose: Classify failures, define severity and response values, and govern blocking
    and repair behavior. Every failure has a required response.
  severity_values:
  - low
  - moderate
  - high
  - critical
  - terminal
  response_values:
  - log
  - repair
  - refuse
  - escalate
  - block
  - terminal_block
  failure_entries:
  - failure_id: protected_source_mutation_attempt
    failure_name: Protected Source Mutation Attempt
    severity: terminal
    response: terminal_block
    description: An actor attempted to modify a protected source file. Terminal block. No repair path.
  - failure_id: gate_bypass_attempt
    detection_layer: verifier
    failure_name: Gate Bypass Attempt
    severity: critical
    response: block
    description: An actor attempted to bypass a required gate. Block immediately.
  - failure_id: test_bypass_attempt
    detection_layer: verifier
    failure_name: Test Bypass Attempt
    severity: critical
    response: block
    description: An actor attempted to bypass a required test. Block immediately.
  - failure_id: ledger_tamper_attempt
    failure_name: Ledger Tamper Attempt
    severity: critical
    response: block
    description: An actor attempted to rewrite or tamper with the ledger. Block immediately.
  - failure_id: unbounded_actor_authority
    failure_name: Unbounded Actor Authority
    severity: critical
    response: block
    description: An actor claimed or was granted final authority. Block immediately.
  - failure_id: final_assembly_before_acceptance
    failure_name: Final Assembly Before Acceptance
    severity: terminal
    response: terminal_block
    description: Final assembly was attempted before user authorization. Terminal block.
  - failure_id: cross_section_consistency_violation
    failure_name: Cross-Section Consistency Violation
    severity: critical
    response: block
    description: A reference ID appeared in one section without a matching definition in its authoritative
      section.
  - failure_id: doctrine_term_corruption
    failure_name: Doctrine Term Corruption
    severity: critical
    response: block
    description: A governed doctrine term was altered, redefined, or removed.
  - failure_id: validation_layer_skipped
    failure_name: Validation Layer Skipped
    severity: high
    response: refuse
    description: A required validation layer was skipped without authorization.
  - failure_id: artifact_missing
    failure_name: Artifact Missing
    severity: high
    response: repair
    description: A required artifact was missing when needed by a gate or role.
  status: locked
  locked_by_pass: PASS_12
  final_assembly_pass: PASS_17
