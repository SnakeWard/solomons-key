name: solomons-key

on:
  push:
    # Both names, deliberately. `git init` still defaults to master on many
    # installs while GitHub defaults to main, and a workflow that silently
    # never fires is worse than no workflow — it looks like passing CI.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: KEY file structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema

      - name: Repair pass is reproducible from the source KEY
        run: |
          python3 repair_pass.py key.yaml /tmp/repaired.yaml
          diff key.repaired.yaml /tmp/repaired.yaml

      - name: Red corpus is reproducible from the green baseline
        run: |
          python3 gen_redcorpus.py key.repaired.yaml /tmp/regen
          diff -r --exclude=manifest.json redcorpus /tmp/regen

      - name: Rules discriminate
        run: python3 test_sk_lint.py

      - name: Derive, emit, and verify wrapper fails closed
        run: python3 test_ci_flow.py

      - name: Lint the shipped KEY file
        run: python3 sk_lint.py key.repaired.yaml

  artifacts:
    name: Artifact schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema

      - name: Schemas are reproducible from the registry
        run: |
          python3 gen_artifact_schemas.py key.repaired.yaml /tmp/schemas
          diff -r schemas/artifacts /tmp/schemas

      - name: Schemas discriminate (valid passes, every invalid fixture fails on its bound rule)
        run: python3 test_sk_artifacts.py

      - name: Valid corpus validates against the live KEY and ledger
        run: |
          python3 sk_artifacts.py validate --dir examples/valid \
            --key key.repaired.yaml \
            --ledger ledger/solomons-key-builder-ledger.jsonl

  runs:
    name: Run conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema

      - name: Run corpus is reproducible
        run: |
          python3 gen_runs.py key.repaired.yaml \
            ledger/solomons-key-builder-ledger.jsonl /tmp/runs
          diff -r --exclude=manifest.json runs /tmp/runs

      - name: The judge convicts (good run passes, every bad run is caught by its rule)
        run: python3 test_sk_verify.py

      - name: The reference run conforms to the KEY contract
        run: python3 sk_verify.py runs/good

  witness:
    name: Ledger integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml

      - name: Tamper detection works
        run: python3 test_sk_ledger.py

      - name: Chain is intact and matches the committed anchor
        run: |
          python3 sk_ledger.py verify \
            ledger/solomons-key-builder-ledger.jsonl \
            --expect-head "$(cat ledger/HEAD)"

      - name: Prior ledger entries were not rewritten in this change
        # The append-only rule, enforced against git history rather than trust.
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE=$(git rev-parse HEAD~1 2>/dev/null) || true
          if [ -n "$BASE" ] && git cat-file -e "$BASE:ledger/solomons-key-builder-ledger.jsonl" 2>/dev/null; then
            git show "$BASE:ledger/solomons-key-builder-ledger.jsonl" > /tmp/base.jsonl
            OLD=$(wc -l < /tmp/base.jsonl)
            head -n "$OLD" ledger/solomons-key-builder-ledger.jsonl > /tmp/prefix.jsonl
            if ! diff -q /tmp/base.jsonl /tmp/prefix.jsonl > /dev/null; then
              echo "::error::Prior ledger entries were modified. The ledger is append-only."
              diff /tmp/base.jsonl /tmp/prefix.jsonl | head -20
              exit 1
            fi
            echo "Append-only preserved: $OLD prior entries unchanged."
          fi

  release-identity:
    name: Immutable release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install runtime and exactly pinned release tools
        run: pip install --requirement requirements.txt --requirement requirements-release.txt
      - name: Version, prerelease, and three-artifact release gate
        env:
          SK_RELEASE_PYTHON: python
        run: python test_sk_release.py
      - name: TestPyPI publishing workflow is least-privilege and fail-closed
        run: python test_publish_workflow.py
      - name: Reproducible build and installed-distribution acceptance
        env:
          SK_RELEASE_PYTHON: python
        run: python build.py acceptance
