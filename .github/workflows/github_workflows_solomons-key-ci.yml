name: "Solomon's Key: derive→emit→verify (isolated)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sk-verify:
    runs-on: ubuntu-latest
    env:
      LEDGER_PATH: ledger/solomons-key-builder-ledger.jsonl
      ROUTE_ID: protocol_build_route
      OUTDIR: runs/ci_run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for dependency staging
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage dependencies for the network-isolated container
        run: |
          python -m pip download \
            --dest "${{ runner.temp }}/sk-wheelhouse" \
            --only-binary=:all: \
            --requirement requirements.txt

      - name: Run derive→emit→verify inside isolated container (network off)
        id: run_sk
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work -w /work \
            -v "${{ runner.temp }}/sk-wheelhouse":/wheelhouse:ro \
            --network none \
            -e LEDGER_PATH \
            -e ROUTE_ID \
            -e OUTDIR \
            python:3.11-slim \
            bash -ec '
              python -m pip install \
                --disable-pip-version-check \
                --no-index \
                --find-links=/wheelhouse \
                --requirement requirements.txt
              bash .github/scripts/run_sk_flow.sh
            '

      - name: Upload SK flow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sk_flow_log
          path: sk_flow.log
          if-no-files-found: warn

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'sk_flow.log';
            let body = '### Solomon\\'s Key verification results\\n';
            if (fs.existsSync(path)) {
              const txt = fs.readFileSync(path, 'utf8');
              // trim if huge
              const trimmed = txt.length > 64000 ? txt.slice(-64000) : txt;
              body += '```\n' + trimmed + '\n```\n';
            } else {
              body += '_No log produced._';
            }
            const pr = context.issue.number;
            if (!pr) {
              console.log('Not a PR context: skipping comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
