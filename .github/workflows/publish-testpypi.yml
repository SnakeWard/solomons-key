name: Publish beta to TestPyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable prerelease tag to recover
        required: true
        type: string

# Jobs opt into only the permissions they need. In particular, the build job
# cannot mint an OIDC token and the publish job cannot modify repository data.
permissions: {}

jobs:
  build:
    name: Build and prove release set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out the recovery verifier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .workflow-source

      - name: Retrieve the original recorded release bytes
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release-assets-${{ env.RELEASE_TAG }}
          path: .release-assets

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Require the tag to equal VERSION
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          version = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:a|b|rc)\d+", tag):
              raise SystemExit(f"refusing non-prerelease tag: {tag!r}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match VERSION {version!r}")
          PY

      - name: Install runtime and exactly pinned release tools
        run: python -m pip install --requirement requirements.txt --requirement requirements-release.txt

      - name: Verify the pinned tree and distribution gates
        if: github.event_name == 'push'
        env:
          SK_RELEASE_PYTHON: python
        run: python build.py verify-drop test-release acceptance

      - name: Rebuild the recorded immutable release set
        if: github.event_name == 'push'
        env:
          SK_RELEASE_PYTHON: python
        run: python build.py dist release-check

      - name: Verify and accept the original immutable release set
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          source = Path(".release-assets")
          verifier_source = Path(".workflow-source/test_release_artifact.py")
          verifier = Path(os.environ["RUNNER_TEMP"]) / "test_release_artifact.py"
          Path("dist").mkdir(exist_ok=True)
          for relative in (
              f"solomons-key-v{version}.tar.gz",
              f"dist/solomons_key-{version}.tar.gz",
              f"dist/solomons_key-{version}-py3-none-any.whl",
          ):
              shutil.copyfile(source / relative, relative)
          shutil.copyfile(verifier_source, verifier)
          shutil.rmtree(source)
          shutil.rmtree(Path(".workflow-source"))
          PY
          python build.py verify-drop release-check
          python -m twine check --strict dist/*.tar.gz dist/*.whl
          PYTHONPATH=. python "${RUNNER_TEMP}/test_release_artifact.py" .

      - name: Stage only Python distribution artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir publish
          cp dist/*.tar.gz dist/*.whl publish/
          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Preserve the proven distributions for the isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: publish/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable set to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/solomons-key/
    permissions:
      id-token: write
    steps:
      - name: Retrieve the proven distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish through TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
